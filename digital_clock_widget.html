<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Urbanist', sans-serif;
      background-color: transparent;
    }

    /* O container ocupa exatamente 100% da tela física do WebDisplays */
    .widget-container {
      width: 100vw;
      height: 100vh;
      background: url('Frame 29.png') center center / cover no-repeat,
                  linear-gradient(180deg, #37a7b8 0%, #688a86 35%, #8f6c5b 60%, #e05326 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 5vw;
    }

    /* Moldura arredondada proporcional à tela de 3x5 */
    .inner-frame {
      width: 86%;
      height: 82%;
      border: 0.45vh solid rgba(255, 255, 255, 0.95);
      border-radius: 4vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 2vh 2vw;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .date-label {
      font-size: 2.4vh;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.35vw;
      opacity: 0.95;
      margin-bottom: 2vh;
    }

    .time-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.88;
      font-variant-numeric: tabular-nums;
      margin: 1.5vh 0;
    }

    .time-digits {
      font-size: 15vh;
      font-weight: 500;
      letter-spacing: -0.3vw;
    }

    .sec-wrapper {
      margin-top: 1.5vh;
      font-size: 2.6vh;
      letter-spacing: 0.15vw;
      opacity: 0.9;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .full-date {
      margin-top: 2.5vh;
      font-size: 2.3vh;
      font-weight: 400;
      opacity: 0.95;
      letter-spacing: 0.08vw;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="inner-frame">
      <div class="date-label" id="day-name">SEXTA-FEIRA</div>
      
      <div class="time-wrapper">
        <span class="time-digits" id="hours">23</span>
        <span class="time-digits" id="minutes">15</span>
      </div>

      <div class="sec-wrapper">
        <span id="seconds">00</span>s
      </div>

      <div class="full-date" id="calendar-date">25 de setembro, 2026</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('hours').textContent = hours;
      document.getElementById('minutes').textContent = minutes;
      document.getElementById('seconds').textContent = seconds;

      const days = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
      document.getElementById('day-name').textContent = days[now.getDay()];

      const months = [
        'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
        'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'
      ];
      const day = now.getDate();
      const month = months[now.getMonth()];
      const year = now.getFullYear();

      document.getElementById('calendar-date').textContent = `${day} de ${month}, ${year}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
